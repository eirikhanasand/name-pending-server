services:
  minecraft:
    image: itzg/minecraft-server
    container_name: name_pending_server
    mem_limit: 8g
    cpus: "4.0"
    ports:
      - "127.0.0.1:25565:25565"
      - "8100:8100"
    environment:
      EULA: "TRUE"
      TYPE: "PURPUR"
      VERSION: "1.21.11"
      PURPUR_BUILD: "2568"
      MEMORY: "8G"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ./data:/data
    restart: unless-stopped
